apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    uid: clickhouse
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: logs
      username: $CLICKHOUSE_USER
      tlsSkipVerify: true
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
