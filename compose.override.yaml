# Local/dev overrides — auto-merged with compose.yaml only.
# Never pass this file on a production host (use compose.prod.yaml instead).
# Infra ports bind to 127.0.0.1 so they are not exposed on LAN/WAN.

services:
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  mysql:
    ports:
      - "127.0.0.1:3306:3306"

  enrichment:
    build:
      context: .
      dockerfile: services/enrichment/Dockerfile
      target: runtime
    image: autopulse-enrichment:local
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./services/enrichment:/app/services/enrichment
      - ./shared:/app/shared
    command:
      [
        "uvicorn",
        "services.enrichment.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]

  pricer:
    build:
      context: .
      dockerfile: services/pricer/Dockerfile
      target: runtime
    image: autopulse-pricer:local
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      AUTO_CREATE_TABLES: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./services/pricer:/app/services/pricer
      - ./shared:/app/shared
    command:
      [
        "uvicorn",
        "services.pricer.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
      ]
