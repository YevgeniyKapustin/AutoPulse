[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopulse-enrichment"
version = "0.1.0"
description = "AutoPulse Data Enrichment Service"
requires-python = ">=3.12"
dependencies = [
  "autopulse-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aio-pika>=9.4",
  "motor>=3.5",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pillow>=10.4",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers>=4.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."
