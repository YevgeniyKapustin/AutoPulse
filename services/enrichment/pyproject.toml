[tool.poetry]
name = "autopulse-enrichment"
version = "0.1.0"
description = "AutoPulse Data Enrichment Service"
authors = ["AutoPulse"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
autopulse-shared = { path = "../../shared", develop = true }
fastapi = "^0.115"
python-multipart = "^0.0.12"
uvicorn = { version = "^0.30", extras = ["standard"] }
aio-pika = "^9.4"
motor = "^3.5"
httpx = "^0.27"
tenacity = "^9.0"
pillow = "^10.4"
numpy = "^2.0"
opencv-python-headless = "^4.10"
onnxruntime = "^1.19"
pydantic-settings = "^2.3"
jinja2 = "^3.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
