# Production overlay — never merge compose.override.yaml on the server.
#
#   export TAG=$(git rev-parse --short HEAD)
#   export ENRICHMENT_ENV_FILE=/run/env/enrichment.env
#   export PRICER_ENV_FILE=/run/env/pricer.env
#   docker compose -f compose.yaml -f compose.prod.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# App secrets come from env_file (not image layers / not hardcoded
# environment: defaults). Datastore bootstrap vars still interpolate from
# the host shell or a project .env next to these compose files.

services:
  rabbitmq:
    logging: &json-log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    logging: *json-log

  mysql:
    logging: *json-log

  enrichment:
    image: ghcr.io/yevgeniykapustin/autopulse-enrichment:${TAG:?set TAG to git sha or semver}
    pull_policy: always
    env_file:
      - path: ${ENRICHMENT_ENV_FILE:-.env.prod.example}
        required: false
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *json-log

  pricer:
    image: ghcr.io/yevgeniykapustin/autopulse-pricer:${TAG:?set TAG to git sha or semver}
    pull_policy: always
    env_file:
      - path: ${PRICER_ENV_FILE:-.env.prod.example}
        required: false
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *json-log
