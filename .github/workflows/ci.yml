name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e "./shared[dev]"
          pip install -e "./services/enrichment[dev]"
          pip install -e "./services/pricer[dev]"

      - name: Ruff
        run: ruff check shared services

      - name: Mypy
        run: mypy shared services/enrichment/app services/pricer/app
        continue-on-error: true

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest shared/tests services/enrichment/tests services/pricer/tests -q
