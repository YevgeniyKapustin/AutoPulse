name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  TAG: ci-${{ github.sha }}
  POETRY_VERSION: "2.1.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache Poetry and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: dep-cache-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'services/**/poetry.lock', 'shared/poetry.lock') }}

      - name: Install monorepo
        run: python scripts/poetry_install.py

      - name: Ruff format check
        run: poetry run ruff format --check shared services

      - name: Ruff lint
        run: poetry run ruff check shared services

      - name: Mypy
        run: poetry run mypy

      - name: Pytest unit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: poetry run pytest -m "not integration" -q

      - name: Pytest integration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: poetry run pytest -m integration -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate local compose merge
        run: docker compose -f compose.yaml -f compose.override.yaml config -q

      - name: Validate production compose merge
        env:
          TAG: ci-${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.prod.yaml config -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build enrichment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/enrichment/Dockerfile
          target: runtime
          push: false
          tags: autopulse-enrichment:${{ env.TAG }}
          cache-from: type=gha,scope=enrichment
          cache-to: type=gha,mode=max,scope=enrichment

      - name: Build pricer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/pricer/Dockerfile
          target: runtime
          push: false
          tags: autopulse-pricer:${{ env.TAG }}
          cache-from: type=gha,scope=pricer
          cache-to: type=gha,mode=max,scope=pricer
