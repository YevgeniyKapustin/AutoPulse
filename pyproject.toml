[tool.ruff]
line-length = 100
target-version = "py312"
src = ["shared", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["shared", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/enrichment/tests", "services/pricer/tests"]
