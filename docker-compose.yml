services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: autopulse-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autopulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-autopulse}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: autopulse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: autopulse-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-autopulse}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autopulse_pricing}
      MYSQL_USER: ${MYSQL_USER:-autopulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-autopulse}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER:-autopulse}",
          "-p${MYSQL_PASSWORD:-autopulse}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  enrichment:
    build:
      context: .
      dockerfile: services/enrichment/Dockerfile
    container_name: autopulse-enrichment
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./services/enrichment:/app/services/enrichment
      - ./shared:/app/shared
    command: >
      uvicorn services.enrichment.app.main:app
      --host 0.0.0.0 --port 8001 --reload

  pricer:
    build:
      context: .
      dockerfile: services/pricer/Dockerfile
    container_name: autopulse-pricer
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./services/pricer:/app/services/pricer
      - ./shared:/app/shared
    command: >
      uvicorn services.pricer.app.main:app
      --host 0.0.0.0 --port 8002 --reload

volumes:
  rabbitmq_data:
  mongodb_data:
  mysql_data:
