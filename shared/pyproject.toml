[tool.poetry]
name = "autopulse-shared"
version = "0.1.0"
description = "Shared Pydantic schemas and messaging contracts for AutoPulse"
authors = ["AutoPulse"]
readme = "README.md"
packages = [{ include = "autopulse_shared" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pydantic = "^2.7"
pydantic-settings = "^2.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
